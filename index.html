<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ask Me About My Sheds</title>
<script>document.documentElement.classList.add("js")</script>
<link rel="icon" href="img/favicon.svg" type="image/svg+xml">
<link rel="icon" href="img/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<meta property="og:type" content="website">
<meta property="og:url" content="https://sheds.sarahleach.design/">
<meta property="og:title" content="Ask Me About My Sheds">
<meta property="og:description" content="Sarah Leach's shed drawings: the She Shed, We Shed, He Shed, and a 1967 Caravel Airstream.">
<meta property="og:image" content="https://sheds.sarahleach.design/img/og.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">

<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Sarah Leach's shed drawings: the She Shed, We Shed, He Shed, and a 1967 Caravel Airstream.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee+Shade&family=Archivo:wdth,wght@62..125,500..900&display=swap" rel="stylesheet">
<style>
  /* Full-bleed two-column checkerboard of color blocks: headline on cream across the left half, four drawing squares in a 2x2 on the right */
  :root {
    --paper: #f6ecd8;
    --ink: #1c1a16;
    --chalk: #fbf6ea;
    --tomato: #d8452f;
    --green: #2c8a4f;
    --cobalt: #2a50b8;
    --pink: #d9558f;
    --mustard: #eec53a;
    --mint: #8fd0b6;
    --display: "Bungee Shade", "Arial Black", Impact, sans-serif;
    --sans: "Archivo", "Helvetica Neue", Arial, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--paper); color: var(--ink); font-family: var(--sans); -webkit-font-smoothing: antialiased; }
  a { color: inherit; text-decoration: none; }

  .lbl { font-weight: 800; font-size: 13px; letter-spacing: .14em; text-transform: uppercase; }

  /* One screen in thirds: the headline column takes the left third and sizes its headline to fit;
     the four drawing blocks share the other two thirds */
  .board {
    height: 100svh; min-height: 520px;
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    grid-template-rows: repeat(2, minmax(0, 1fr));
    grid-template-areas:
      "copy she we"
      "copy he air";
  }
  .copy { grid-area: copy; } .she { grid-area: she; } .we { grid-area: we; }
  .he { grid-area: he; } .air { grid-area: air; }
  .block {
    position: relative; min-width: 0; min-height: 0;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
  }

  /* Text half */
  .copy { background: var(--paper); justify-content: flex-start; padding: 0 clamp(20px, 2.4vw, 40px); container-type: inline-size; }
  h1 { font-family: var(--display); font-weight: 400; font-size: clamp(40px, min(calc(100cqw / 6.15), 18svh), 170px); line-height: 1.05; color: var(--cobalt); }
  /* Script logo from the portfolio, tinted cobalt by using the PNG as a mask, top-left of the headline column */
  .logo {
    position: absolute; left: clamp(20px, 2.4vw, 40px); top: clamp(18px, 2vw, 30px);
    display: block; width: clamp(80px, 7vw, 120px); aspect-ratio: 371 / 279;
    background: var(--cobalt);
    -webkit-mask: url(img/sarahleach-logo.png) center / contain no-repeat;
    mask: url(img/sarahleach-logo.png) center / contain no-repeat;
    transition: transform .3s;
  }
  .logo:hover, .logo:focus-visible { transform: rotate(-4deg); }

  /* Portfolio link and copyright pinned to the bottom. The link uses the same pill as the drawing labels, in the headline's cobalt */
  .foot {
    position: absolute; left: clamp(20px, 2.4vw, 40px); bottom: clamp(18px, 2vw, 30px);
    display: grid; gap: 12px; justify-items: start;
  }
  .copyright { font-size: 10px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: color-mix(in srgb, var(--ink) 60%, var(--paper)); }
  .home {
    --c: var(--cobalt); --deep: color-mix(in srgb, var(--c) 62%, var(--ink));
    padding: 5px 13px; border: 1px solid color-mix(in srgb, var(--c) 55%, transparent); border-radius: 99px;
    background: transparent; color: var(--c);
    font-weight: 600; font-size: 10.5px; letter-spacing: .14em; white-space: nowrap;
    transition: background-color .25s, color .25s;
  }
  .home:hover, .home:focus-visible { background: var(--cobalt); border-color: var(--cobalt); color: var(--chalk); }

  /* Drawing block: flat color print with a cream keyline */
  .dwg {
    --c: var(--cobalt);
    background: var(--c);
    padding: 9% 7% 15%;
  }
  .dwg::before {
    content: ""; position: absolute; inset: 10px;
    border: 1px solid rgba(251,246,234,.7); pointer-events: none;
  }
  .dwg img {
    display: block; width: 100%; height: 100%; object-fit: contain;
    filter: invert(1) brightness(1.02);
    transition: transform .5s cubic-bezier(.2,.8,.3,1.2);
  }
  .dwg:hover img, .dwg:focus-visible img { transform: translate(calc(var(--mx, 0) * -6px), calc(var(--my, 0) * -6px)) scale(1.04) rotate(-.6deg); }

  /* On hover the real shed fades in under the drawing: the photo settles from a slight zoom while
     the linework fades out, and the bottom melts into the square's own color so the label still reads. */
  .photo {
    position: absolute; inset: 0; z-index: 0;
    background: var(--photo) var(--pos, 50% 50%) / cover no-repeat;
    opacity: 0; transform: scale(1.08);
    transition: opacity .55s ease, transform 1.4s cubic-bezier(.2,.7,.2,1);
  }
  .photo::after {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(to top, color-mix(in srgb, var(--c) 85%, transparent) 0%, color-mix(in srgb, var(--c) 25%, transparent) 30%, transparent 55%);
  }
  .dwg img { position: relative; z-index: 1; transition: transform .5s cubic-bezier(.2,.8,.3,1.2), opacity .45s ease; }
  .dwg::before, .tag, .callout { z-index: 2; }
  @media (hover: hover) {
    .dwg:hover .photo { opacity: 1; transform: translate(calc(var(--mx, 0) * -8px), calc(var(--my, 0) * -8px)) scale(1.03); }
    .dwg:hover img { opacity: 0; }
    .js .dwg:hover .photo:not(.ready) { opacity: 0; }
    .js .dwg:hover .photo:not(.ready) + img { opacity: 1; }
  }
  .dwg:focus-visible .photo { opacity: 1; transform: none; }
  /* corner callouts get a solid backing in the square's color so they read over bright sky */
  .callout { transition: background-color .3s ease; }
  .dwg:hover .callout, .dwg:focus-visible .callout { background: var(--c); }
  .dwg:focus-visible img { opacity: 0; }
  .dwg:focus-visible { outline: 3px solid var(--chalk); outline-offset: -10px; }
  .she { --c: var(--tomato); }
  .we  { --c: var(--green); }
  .he  { --c: var(--cobalt); }
  .air { --c: var(--pink); }

  .tag {
    position: absolute; left: 50%; bottom: clamp(18px, 2vw, 30px); transform: translateX(-50%);
    display: inline-flex; align-items: center;
    padding: 5px 13px;
    --deep: color-mix(in srgb, var(--c) 62%, var(--ink));
    border: 1px solid rgba(251,246,234,.55); border-radius: 99px;
    background: transparent;
    color: rgba(251,246,234,.85);
    font-weight: 600; font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase;
    white-space: nowrap;
    transition: background-color .25s, color .25s, border-color .25s;
  }
  .dwg:hover .tag, .dwg:focus-visible .tag { background: var(--chalk); border-color: var(--chalk); color: var(--deep); }

  .callout {
    position: absolute; right: 20px; top: 20px;
    font-weight: 700; font-size: 9px; letter-spacing: .14em; text-transform: uppercase; color: var(--chalk);
    padding: 4px 10px; border: 1.5px solid var(--chalk); border-radius: 99px;
  }


  @media (prefers-reduced-motion: reduce) {
    .dwg img, .tag { transition: none; }
    .photo { transition: opacity .2s ease; transform: none; }
  }

  /* Phone: the headline, then the four drawings stacked one per row */
  @media (max-width: 680px) {
    .board {
      height: auto; grid-template-columns: minmax(0, 1fr); grid-template-rows: none;
      grid-template-areas: "copy" "she" "we" "he" "air";
    }
    .block { aspect-ratio: 1; }
    h1 { font-size: min(calc((100vw - 44px) / 6.1), 110px); }
    .copy { flex-direction: column; align-items: flex-start; gap: 28px; }
    .foot, .logo { position: static; }
    .tag { font-size: 9px; letter-spacing: .08em; padding: 4px 10px; }
    .callout { right: 14px; top: 14px; font-size: 7.5px; padding: 3px 7px; }
    .copy { aspect-ratio: auto; padding-block: 56px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  }

  /* ---------- loading states and small interactions ---------- */
  /* while a drawing loads, its square shimmers; once loaded the linework draws in left to right */
  .dwg::after {
    content: ""; position: absolute; inset: 0; z-index: 1; pointer-events: none; opacity: 0;
    background: linear-gradient(105deg, transparent 35%, rgba(251,246,234,.16) 50%, transparent 65%) 0 0 / 250% 100%;
    transition: opacity .4s ease;
  }
  .js .dwg:not(.loaded)::after { opacity: 1; animation: shimmer 1.3s linear infinite; }
  @keyframes shimmer { from { background-position: 100% 0; } to { background-position: -150% 0; } }
  .js .dwg img { clip-path: inset(0 100% 0 0); }
  .js .dwg.loaded img { clip-path: inset(0 0 0 0); transition: clip-path 1.1s cubic-bezier(.6,0,.2,1), transform .5s cubic-bezier(.2,.8,.3,1.2), opacity .45s ease; }
  /* label pills grow a small arrow on hover: on to the She Shed site, out to Pinterest for the rest */
  .tag::after { content: "\2197"; display: inline-block; width: 0; opacity: 0; overflow: hidden; transition: width .25s ease, opacity .25s ease, margin .25s ease; }
  .she .tag::after { content: "\2192"; }
  .dwg:hover .tag::after, .dwg:focus-visible .tag::after { width: 1em; margin-left: .45em; opacity: 1; }
  .dwg:active .tag { transform: translateX(-50%) scale(.95); }
  .home { transition: background-color .25s, color .25s, transform .2s ease; }
  .home:active { transform: scale(.96); }
  @media (prefers-reduced-motion: no-preference) {
    /* entrance: headline lines rise in turn, the squares wipe up one after another, the rest fades in */
    .js h1 .ln { display: inline-block; animation: rise .9s cubic-bezier(.2,.8,.2,1) both; animation-delay: calc(var(--i) * 110ms + 120ms); }
    @keyframes rise { from { opacity: 0; transform: translateY(.4em); } }
    .js .dwg { animation: wipe .95s cubic-bezier(.7,0,.2,1) both; animation-delay: calc(var(--i) * 110ms + 200ms); }
    @keyframes wipe { from { clip-path: inset(100% 0 0 0); } to { clip-path: inset(0 0 0 0); } }
    .js .logo, .js .foot { animation: fadein .8s ease both .55s; }
    @keyframes fadein { from { opacity: 0; } }
  }
  @media (prefers-reduced-motion: reduce) {
    .js .dwg img { clip-path: none; }
    .js .dwg:not(.loaded)::after { animation: none; opacity: .5; }
    .tag::after { transition: none; }
  }
</style>
</head>
<body>
<main class="board">
    <div class="block copy">
      <a class="logo" href="https://sarahleach.design/" aria-label="Sarah Leach, design portfolio"></a>
      <h1><span class="ln" style="--i:0">Ask me</span><br><span class="ln" style="--i:1">about</span><br><span class="ln" style="--i:2">my sheds</span></h1>
      <div class="foot">
        <a class="lbl home" href="https://sarahleach.design/">&larr; Design portfolio</a>
        <small class="copyright">&copy; 2026 Sarah Leach</small>
      </div>
    </div>
    <a class="block dwg she" id="she" style="--i:0" href="https://sheshed.sarahleach.design/">
      <span class="photo" style="--photo:url(img/photo-she.jpg);--pos:50% 55%" aria-hidden="true"></span>
      <img src="img/shes.png" alt="Elevation of the She Shed, a wall of salvaged windows with café lights along the roof">
      <span class="tag">She Shed</span>
    </a>
    <a class="block dwg we" id="we" style="--i:1" href="https://www.pinterest.com/prettycasualspace/we-shed/" target="_blank" rel="noopener">
      <span class="photo" style="--photo:url(img/photo-we.jpg);--pos:43% 50%" aria-hidden="true"></span>
      <img src="img/we.png" alt="Elevation of the We Shed, with a bar counter, two stools and a lean-to">
      <span class="callout">Good Enough Shed</span>
      <span class="tag">We Shed</span>
    </a>
    <a class="block dwg he" id="he" style="--i:2" href="https://www.pinterest.com/prettycasualspace/he-shed/" target="_blank" rel="noopener">
      <span class="photo" style="--photo:url(img/photo-he.jpg);--pos:50% 50%" aria-hidden="true"></span>
      <img src="img/he.png" alt="Elevation of the He Shed, with a glass-paneled garage door">
      <span class="tag">He Shed</span>
    </a>
    <a class="block dwg air" id="air" style="--i:3" href="https://www.pinterest.com/prettycasualspace/airstream/" target="_blank" rel="noopener">
      <span class="photo" style="--photo:url(img/photo-air.jpg);--pos:52% 50%" aria-hidden="true"></span>
      <img src="img/air.png" alt="Side elevation of a 1967 Caravel Airstream trailer">
      <span class="callout">I know&hellip; not a shed</span>
      <span class="tag">1967 Airstream</span>
    </a>
</main>

<script>
(function(){
  var squares = [].slice.call(document.querySelectorAll(".dwg"));
  // loading state: mark each square once its drawing has loaded (or failed, so it never stays shimmering)
  squares.forEach(function(sq){
    var img = sq.querySelector("img");
    function done(){ sq.classList.add("loaded"); }
    if (img.complete) done(); else { img.addEventListener("load", done); img.addEventListener("error", done); }
  });
  // hover photos: preload them once the page has settled; a photo only takes over after it has arrived
  function preload(){
    squares.forEach(function(sq){
      var ph = sq.querySelector(".photo"); if (!ph) return;
      var url = getComputedStyle(ph).getPropertyValue("--photo").trim().replace(/^url\(["']?|["']?\)$/g, "");
      var im = new Image(); im.onload = function(){ ph.classList.add("ready"); }; im.src = url;
    });
  }
  if (document.readyState === "complete") setTimeout(preload, 300); else addEventListener("load", function(){ setTimeout(preload, 300); });
  // depth: the drawing or photo drifts a few pixels with the cursor
  if (matchMedia("(hover: hover) and (prefers-reduced-motion: no-preference)").matches) {
    squares.forEach(function(sq){
      sq.addEventListener("pointermove", function(e){
        var r = sq.getBoundingClientRect();
        sq.style.setProperty("--mx", ((e.clientX - r.left) / r.width * 2 - 1).toFixed(3));
        sq.style.setProperty("--my", ((e.clientY - r.top) / r.height * 2 - 1).toFixed(3));
      });
      sq.addEventListener("pointerleave", function(){ sq.style.removeProperty("--mx"); sq.style.removeProperty("--my"); });
    });
  }
})();
</script>
</body>
</html>
